services:
  api-gateway:
    build: ./services/api-gateway
    ports: ["8000:8000"]
    depends_on: [redis]

  payment-service:
    build: ./services/payment-service
    ports: ["8001:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@payment-db:5432/payments
    volumes:
      - ./services/payment-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      payment-db:
        condition: service_healthy

  ledger-service:
    build: ./services/ledger-service
    ports: ["8002:8000"]
    depends_on: [ledger-db]

  payment-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: payments
    volumes: [payment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 3s
      timeout: 3s
      retries: 10

  ledger-db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ledger
    volumes: [ledger-db-data:/var/lib/postgresql/data]

  redis:
    image: redis:7

volumes:
  payment-db-data:
  ledger-db-data: